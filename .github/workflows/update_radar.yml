name: Update GitHub Radar

on:
  schedule:
    # 每天 UTC 16:00 运行（北京时间次日 00:00）
    - cron: "0 16 * * *"
  workflow_dispatch:

# 供 GitHub Actions 自动 Token 将生成的图片提交回当前仓库
permissions:
  contents: write

# 避免定时任务与手动触发同时修改同一张图片
concurrency:
  group: update-github-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # 新脚本读取此变量
      GH_STATS_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

      # 保留此变量，以兼容仍使用旧变量名的脚本
      GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 在生成图片前先同步，避免后续 rebase 与生成的 PNG 冲突
      - name: Sync with remote
        run: git pull --rebase origin main

      - name: Run Script
        run: python utils/CommitTimeRadar.py

      - name: Commit and Push
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add imgs/github_commit_radar.png

          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore: update GitHub radar"
            git push origin main
          fi
